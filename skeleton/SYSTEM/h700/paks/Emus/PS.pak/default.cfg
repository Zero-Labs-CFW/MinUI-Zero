-minarch_threading = Off

-pcsx_rearmed_display_internal_fps = disabled
-pcsx_rearmed_show_input_settings = disabled

pcsx_rearmed_dithering = enabled

# pcsx's async GPU thread is upstream default-ON for multicore, and on the Brick it was THE
# decisive regression (D48): the gpu_async scanout-sync handshake SERIALIZED the emu and GPU
# threads, leaving both half-idle at gen 41/60 while raw work was only 86% of ONE core.
# Disabling it is already the default on Brick and Smart Pro; the Miyoo port never got it.
#
# The H700 has the Brick's core cluster (4x Cortex-A53, 1 GB of RAM), so the Brick's mechanism carries
# over as is.
#
# UNMEASURED ON THIS HARDWARE: carried over on mechanism, not on an H700 benchmark. Left UNLOCKED
# (no leading '-') so it can be toggled in-game to A/B it against the same scene.
pcsx_rearmed_gpu_thread_rendering = disabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Circle = A
bind Cross = B
bind Triangle = X
bind Square = Y
bind L1 Button = L1
bind R1 Button = R1
bind L2 Button = L2
bind R2 Button = R2
# Stick clicks: the RG35XX H/Pro and RG40XX H/V send L3/R3 (platform.c ev_translate, 313/316); inert on
# the stickless boards. Without these rows the PS core never sees them (NextUI h700-rc11, 7a69255).
bind L3 Button = L3
bind R3 Button = R3
